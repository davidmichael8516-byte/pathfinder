<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Explorer - Pathfinder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body class="bg-amber-50 font-sans">
  <!-- Header Component -->
  <script src="components/header.js"></script>
  <custom-header></custom-header>

  <!-- Quran and Hadith Section -->
  <section id="quran-hadith-section" class="py-10 px-4 md:px-8 bg-amber-100 text-center">
    <h2 class="text-2xl md:text-3xl font-playfair font-bold text-green-900 mb-6">
      Quran and Hadith Reflections
    </h2>
    <div id="quran-verse" class="text-lg text-gray-800 mb-6"></div>
    <div id="hadith-verse" class="text-lg text-gray-700"></div>
  </section>

  <!-- Quran Hero -->
  <section class="py-16 px-4 md:px-8 bg-gradient-to-r from-green-800 to-green-900 text-white">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-playfair font-bold mb-4">Quran Explorer</h1>
      <p class="text-xl max-w-3xl mx-auto">
        Discover the divine words of Allah with translations and recitations
      </p>
    </div>
  </section>

  <!-- Quran Content -->
  <section class="py-16 px-4 md:px-8">
    <div class="max-w-6xl mx-auto">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Surah List -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-xl shadow-md p-6 sticky top-24">
            <h2 class="text-xl font-playfair font-bold text-green-900 mb-4">Surahs</h2>
            <div class="space-y-2 max-h-[600px] overflow-y-auto" id="surah-list">
              <!-- Surahs populated by JavaScript -->
            </div>
          </div>
        </div>

        <!-- Verse Display -->
        <div class="lg:col-span-3">
          <div class="bg-white rounded-xl shadow-md p-8">
            <div class="text-center mb-10" id="surah-info">
              <h2 class="text-2xl font-playfair font-bold text-green-900 mb-2">Select a Surah</h2>
              <p class="text-gray-600">Choose a chapter from the Quran to explore its verses</p>
            </div>

            <div id="verse-container">
              <!-- Verses populated by JavaScript -->
            </div>

            <div class="flex justify-between items-center mt-10">
              <button id="prev-btn" class="bg-green-800 hover:bg-green-900 text-white py-2 px-6 rounded-lg transition duration-300 hidden">
                Previous
              </button>
              <button id="next-btn" class="bg-green-800 hover:bg-green-900 text-white py-2 px-6 rounded-lg transition duration-300 hidden">
                Next
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer Component -->
  <script src="components/footer.js"></script>
  <custom-footer></custom-footer>

  <script>
    feather.replace();
  </script>

  <!-- Quran and Hadith Script -->
  <script>
    const QURAN_API_URL = "https://api.alquran.cloud/v1/ayah/random";
    const HADITH_API_URL = "https://hadithapi.com/api/hadiths/random";
    const HADITH_API_KEY = "YOUR_API_KEY_HERE"; // Replace with your actual key or use environment variable

    async function loadQuranAndHadith() {
      const quranDiv = document.getElementById("quran-verse");
      const hadithDiv = document.getElementById("hadith-verse");

      quranDiv.innerHTML = "Loading Quran verse...";
      hadithDiv.innerHTML = "Loading Hadith...";

      try {
        // Quran verse
        const quranRes = await fetch(QURAN_API_URL);
        const quranData = await quranRes.json();
        if (quranData && quranData.data) {
          quranDiv.innerHTML = `
            <strong>Quran:</strong> ${quranData.data.text}
            <br><small>(${quranData.data.surah.englishName} ${quranData.data.numberInSurah})</small>
          `;
        } else {
          quranDiv.innerHTML = "Could not load Quran verse.";
        }

        // Hadith
        const hadithRes = await fetch(HADITH_API_URL, {
          headers: { "Authorization": `Bearer ${HADITH_API_KEY}` }
        });
        const hadithData = await hadithRes.json();
        if (hadithData && hadithData.hadith && hadithData.hadith.hadithEnglish) {
          hadithDiv.innerHTML = `
            <strong>Hadith:</strong> ${hadithData.hadith.hadithEnglish}
            <br><small>Source: ${hadithData.hadith.book.bookName}</small>
          `;
        } else {
          hadithDiv.innerHTML = "Could not load Hadith.";
        }

      } catch (error) {
        console.error("Error loading Quran or Hadith:", error);
        quranDiv.innerHTML = "Error loading Quran verse.";
        hadithDiv.innerHTML = "Error loading Hadith.";
      }
    }

    document.addEventListener("DOMContentLoaded", loadQuranAndHadith);
  </script>

  <script src="quran.js"></script>
</body>
</html>
