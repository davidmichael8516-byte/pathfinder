<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pathfinder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-amber-50 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-red-800 py-6 px-8">
            <h1 class="text-2xl font-playfair font-bold text-white text-center">Create Your Account</h1>
        </div>
        
        <form class="px-8 py-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2" for="first-name">First Name</label>
                    <input id="first-name" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="Your first name">
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2" for="last-name">Last Name</label>
                    <input id="last-name" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="Your last name">
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2" for="email">Email Address</label>
                <input id="email" type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="your.email@example.com">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2" for="password">Password</label>
                    <input id="password" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="••••••••">
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2" for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="••••••••">
                </div>
            </div>
            
            <div class="mb-8">
                <label class="block text-gray-700 text-sm font-medium mb-2">Gender</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center p-4 border border-gray-300 rounded-lg cursor-pointer hover:bg-amber-50">
                        <input type="radio" name="gender" value="male" class="h-4 w-4 text-red-600 focus:ring-red-500">
                        <span class="ml-3 text-gray-700">Brother</span>
                    </label>
                    <label class="flex items-center p-4 border border-gray-300 rounded-lg cursor-pointer hover:bg-amber-50">
                        <input type="radio" name="gender" value="female" class="h-4 w-4 text-red-600 focus:ring-red-500">
                        <span class="ml-3 text-gray-700">Sister</span>
                    </label>
                </div>
            </div>
            
            <div class="flex items-center mb-8">
                <input id="terms" type="checkbox" class="h-4 w-4 text-red-600 focus:ring-red-500 border-gray-300 rounded">
                <label for="terms" class="ml-2 block text-sm text-gray-700">I agree to the <a href="#" class="text-red-800 font-medium hover:text-red-900">Terms and Conditions</a></label>
            </div>
            
            <button type="submit" class="w-full bg-red-800 hover:bg-red-900 text-white font-medium py-3 px-4 rounded-lg transition duration-300 mb-6">Create Account</button>
            
            <div class="text-center">
                <p class="text-gray-600">Already have an account? <a href="login.html" class="text-red-800 font-medium hover:text-red-900">Sign in</a></p>
            </div>
        </form>
    </div>

    <script>
        feather.replace();
    </script>
</body>
</html>
