<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pathfinder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-amber-50 font-sans min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-red-800 py-6 px-8">
      <h1 class="text-2xl font-playfair font-bold text-white text-center">
        Assalamu Alaikum, Welcome Back
      </h1>
    </div>

    <form id="login-form" class="px-8 py-10">
      <div class="mb-6">
        <label for="email" class="block text-gray-700 text-sm font-medium mb-2">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-feather="mail" class="text-gray-400 w-5 h-5"></i>
          </div>
          <input id="email" type="email" required class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="your.email@example.com">
        </div>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-700 text-sm font-medium mb-2">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-feather="lock" class="text-gray-400 w-5 h-5"></i>
          </div>
          <input id="password" type="password" required class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-full bg-red-800 hover:bg-red-900 text-white font-medium py-3 px-4 rounded-lg transition duration-300">
        Sign In
      </button>

      <div class="mt-6 text-center">
        <p class="text-gray-600">
          Don't have an account? <a href="register.html" class="text-red-800 font-medium hover:text-red-900">Register now</a>
        </p>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>feather.replace();</script>
</body>
</html>
